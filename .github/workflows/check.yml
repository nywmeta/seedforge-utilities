name: Check free utilities
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_tag:
        description: 'Optional published LAN Cast tag to verify anonymously'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lan-cast:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -B scripts/release.py --node node
      - name: Verify published release anonymously
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_tag != '' }}
        env:
          LAN_CAST_VERIFY_TAG: ${{ inputs.verify_tag }}
        run: |
          python -B scripts/verify_publication.py --repo "$GITHUB_REPOSITORY" --tag "$LAN_CAST_VERIFY_TAG" --archive "dist/$LAN_CAST_VERIFY_TAG.zip"
          python -B -c 'from pathlib import Path; print(Path("publication.json").read_text())'
